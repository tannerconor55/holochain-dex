# DNA manifest (Holochain 0.7, manifest_version "0").
# Changing any integrity zome, or this file's integrity section, changes the DNA hash.
manifest_version: "0"
name: dex
integrity:
  network_seed: null
  # Read by both integrity zomes (dex_core::properties::DexProperties). An agent
  # cannot join, and validation refuses, if these are missing or malformed.
  # Every market is quoted in the hub unit HF. Changing any value is a new DNA
  # hash, so a new network.
  properties:
    park_timeout_secs: 1800 # a park may be settled for 30 min (or until expiry) ...
    settle_grace_secs: 300  # ... plus 5 min; after that only the taker may reclaim it
    max_order_lifetime_secs: 604800 # 7 days: an order may be listed at most this long
    units:
      - id: A
        decimals: 2
      - id: HF
        decimals: 2
    markets:
      - base: A
        quote: HF
        lot_size: 100 # 1.00 A per lot
        tick_size: 1  # prices in steps of 0.01 HF
  zomes:
    # Mock Unyt ledger. Replaced by Unyt itself once API access exists.
    - name: ledger_integrity
      path: ../../target/wasm32-unknown-unknown/release/ledger_integrity.wasm
    # Order book listings: links to ledger escrows, validated against
    # ledger_integrity's Escrow entry (found by zome name, not position).
    - name: dex_integrity
      path: ../../target/wasm32-unknown-unknown/release/dex_integrity.wasm
coordinator:
  zomes:
    - name: ledger
      path: ../../target/wasm32-unknown-unknown/release/ledger.wasm
      dependencies:
        - name: ledger_integrity
    # Order book: listing, book reads, take planning. Settles only through
    # `call`s to the ledger zome.
    - name: dex
      path: ../../target/wasm32-unknown-unknown/release/dex.wasm
      dependencies:
        - name: dex_integrity
