[workspace]
resolver = "2"
members = [
    "crates/dex_core",
    "crates/ledger_api",
    "dnas/dex/zomes/integrity/ledger",
    "dnas/dex/zomes/coordinator/ledger",
]
# The Sweettest crate pulls in the whole `holochain` conductor and is built
# separately (see README), so it is not a default workspace member.
exclude = ["tests/sweettest"]

[workspace.dependencies]
# Pinned to the Holochain 0.6 line to match the holonix `main-0.6` dev shell.
hdi = "=0.7.3"
hdk = "=0.6.3"
serde = { version = "1", features = ["derive"] }
holochain_serialized_bytes = "=0.0.57"

dex_core = { path = "crates/dex_core" }
ledger_api = { path = "crates/ledger_api" }
ledger_integrity = { path = "dnas/dex/zomes/integrity/ledger" }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
