[package]
name = "dex_sweettest"
version = "0.1.0"
edition = "2021"
publish = false

# Built separately from the zome workspace: `holochain` is the full conductor.
# Run from the repo root inside the dev shell:
#   nix develop -c ./build.sh
#   nix develop -c cargo test --manifest-path tests/sweettest/Cargo.toml
[workspace]

[dependencies]
dex_core = { path = "../../crates/dex_core" }
ledger_api = { path = "../../crates/ledger_api" }
dex_api = { path = "../../crates/dex_api" }
holochain = { version = "=0.7.0", features = ["test_utils"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# The conductor compiles every zome's wasm with Cranelift on first use; an
# unoptimised build of `holochain` makes that take ~30 s per agent. Optimise
# dependencies (not this crate, so test edits rebuild fast).
[profile.dev.package."*"]
opt-level = 3
