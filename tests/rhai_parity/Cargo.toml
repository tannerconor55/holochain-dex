[package]
name = "rhai_parity"
version = "0.1.0"
edition = "2021"
publish = false

# Runs unyt/dex_order_escrow through the published rave_engine and compares
# every run with dex_core::execute_run. Own workspace, like tests/sweettest:
#   nix develop -c cargo test --manifest-path tests/rhai_parity/Cargo.toml
[workspace]

[dependencies]
dex_core = { path = "../../crates/dex_core" }
# The engine version inspected for the template (see its README).
rave_engine = "=0.12.0"
hdi = "=0.8.0"
# `mock`: MockHdkT answers the host reads acceding_sort_allocation makes, the
# way rave_engine's own tests do.
hdk = { version = "=0.7.0", features = ["mock"] }
serde_json = "1"
rmp-serde = "1"
